name: .NET Tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AlgoTrading

    steps:
      - name: Checkout AlgoTrading
        uses: actions/checkout@v4
        with:
          path: AlgoTrading

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate API structure
        run: python Tools/validate_api_structure.py

  tests:
    name: Tests (shard ${{ matrix.shard }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ '00', '01', '02', '03', '04', '05', '06', '07' ]
    defaults:
      run:
        working-directory: AlgoTrading

    steps:
      - name: Checkout AlgoTrading
        uses: actions/checkout@v4
        with:
          path: AlgoTrading

      - name: Checkout StockSharp
        uses: actions/checkout@v4
        with:
          repository: StockSharp/StockSharp
          ref: master
          path: 'StockSharp (GitHub)'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Tests/Tests.csproj --restore --configuration Release

      - name: Run tests
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --filter "TestCategory=Shard${{ matrix.shard }}"
