name: Point1 Part05 Selected Replays
on:
  push:
    branches: [work/point1-part05-20261016]
    paths:
      - 'API/**'
      - 'Tests/StrategyTests.Point1Part05.cs'
      - '.github/workflows/point1-part05-selected.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: point1-part05-feature-branch
  cancel-in-progress: true
jobs:
  selected:
    if: github.ref == 'refs/heads/work/point1-part05-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AlgoTrading
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          path: AlgoTrading
          persist-credentials: false
      - name: Checkout StockSharp sibling
        uses: actions/checkout@v4
        with:
          repository: StockSharp/StockSharp
          ref: master
          path: 'StockSharp (GitHub)'
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build only the test harness
        run: dotnet build Tests/Tests.csproj -c Release --maxcpucount:1 -p:BuildInParallel=false
      - name: Run ONLY selected Point1Part05 tests
        run: >
          dotnet test Tests/Tests.csproj --no-build -c Release
          --filter "FullyQualifiedName~Point1Part05_CmRsi|FullyQualifiedName~Point1Part05_VininITrendLrma|FullyQualifiedName~Point1Part05_FisherOrgSign|FullyQualifiedName~Point1Part05_ColorStepXccx"
          --blame-hang-timeout 10m
          -- RunConfiguration.MaxCpuCount=1
