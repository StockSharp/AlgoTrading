<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Reversion strategy logo for C#</title>
  <desc id="description">A boomerang leaves an extreme edge and curves back to the center.</desc>

  <defs>
    <clipPath id="badge-clip">
      <circle cx="256" cy="256" r="232" />
    </clipPath>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }

    .badge {
      fill: #f4f7f8;
      stroke: #277785;
    }

    .badge-fill {
      fill: #f4f7f8;
    }

    .badge-stroke {
      stroke: #f4f7f8;
    }

    .language-mark {
      fill: #17364a;
      opacity: 0.06;
    }

    .python-upper {
      fill: #2874a6;
      opacity: 0.09;
    }

    .python-lower {
      fill: #a77b00;
      opacity: 0.09;
    }

    .python-eye {
      fill: #f4f7f8;
    }

    .accent-fill {
      fill: #079b7e;
    }

    .accent-stroke {
      stroke: #079b7e;
    }

    .solid-fill {
      fill: #17364a;
    }

    .solid-stroke {
      stroke: #17364a;
    }

    .muted-fill {
      fill: #526b78;
    }

    .muted-stroke {
      stroke: #526b78;
    }

    .warm-fill {
      fill: #d97706;
    }

    .warm-stroke {
      stroke: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      .badge {
        fill: #0d2638;
        stroke: #277785;
      }

      .badge-fill {
        fill: #0d2638;
      }

      .badge-stroke {
        stroke: #0d2638;
      }

      .language-mark {
        fill: #edf2f3;
        opacity: 0.07;
      }

      .python-upper {
        fill: #79b7df;
        opacity: 0.1;
      }

      .python-lower {
        fill: #f0c84b;
        opacity: 0.1;
      }

      .python-eye {
        fill: #0d2638;
      }

      .accent-fill {
        fill: #43d6b1;
      }

      .accent-stroke {
        stroke: #43d6b1;
      }

      .solid-fill {
        fill: #edf2f3;
      }

      .solid-stroke {
        stroke: #edf2f3;
      }

      .muted-fill {
        fill: #8fa2aa;
      }

      .muted-stroke {
        stroke: #8fa2aa;
      }

      .warm-fill {
        fill: #f6b73c;
      }

      .warm-stroke {
        stroke: #f6b73c;
      }
    }
  </style>

  <circle class="badge" cx="256" cy="256" r="240" stroke-width="12" />

  <g clip-path="url(#badge-clip)">
    <!-- The implementation language stays visible as a quiet background watermark. -->
    <text class="language-mark" x="256" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="360" font-weight="800" letter-spacing="-18" text-anchor="middle" aria-hidden="true">C#</text>

    <!-- Strategy metaphor. -->
    <circle class="muted-stroke badge-fill" cx="256" cy="256" r="78" stroke-width="12" />
    <circle class="warm-fill" cx="256" cy="256" r="18" />
    <path class="solid-stroke" d="M407 128 C449 215 413 343 311 392 C230 431 137 403 94 340" fill="none" stroke-width="17" stroke-linecap="round" />
    <path class="solid-fill" d="M78 313 L120 340 L82 366 Z" />
    <path class="accent-fill" d="M402 107 C366 149 332 175 294 197 L337 204 C363 184 391 157 418 126 Z" />
    <path class="accent-stroke" d="M408 128 C367 183 328 219 278 246" fill="none" stroke-width="13" stroke-linecap="round" />
    <path class="accent-fill" d="M253 258 L283 223 L294 261 Z" />
  </g>
</svg>
