<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description"><title id="title">Color Rsi Macd strategy logo for Python</title><desc id="description">Four-position MACD mode dial with zero, signal, histogram, and turn pictograms.</desc><style>:root{color-scheme:light dark;--p:hsl(195 44% 39%);--pl:hsl(195 52% 72%);--ps:hsl(195 44% 24%);--s:hsl(327 67% 43%);--sl:hsl(327 75% 72%);--ss:hsl(327 67% 27%);--a:hsl(71 56% 49%);--pos:hsl(148 47% 39%);--neg:hsl(5 59% 52%);--v:hsl(129 48% 45%);--n:#243538;--pale:#cbd7d4;}.language-mark{fill:#17323d;opacity:.085}.python-upper{fill:#2874a6;opacity:.085}.python-lower{fill:#aa8108;opacity:.085}@media(prefers-color-scheme:dark){:root{--p:hsl(195 49% 67%);--pl:hsl(195 54% 82%);--ps:hsl(195 40% 49%);--s:hsl(327 73% 66%);--sl:hsl(327 79% 81%);--ss:hsl(327 64% 45%);--a:hsl(71 62% 70%);--pos:hsl(148 51% 62%);--neg:hsl(5 75% 70%);--v:hsl(129 58% 69%);--n:#edf3f1;--pale:#70817c;}.language-mark{fill:#edf6f3;opacity:.105}.python-upper{fill:#7ec5ed;opacity:.105}.python-lower{fill:#f1ca50;opacity:.105}}</style><g aria-hidden="true"><path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z"/><path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)"/></g><g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><text x="256" y="48" fill="var(--n)" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">MACD: 4 MODES</text><rect x="40" y="103" width="98" height="244" rx="16" fill="var(--pl)" stroke="var(--ps)" stroke-width="9"/><text x="89.0" y="193" fill="var(--n)" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="middle">0</text><rect x="59" y="237" width="60" height="18" rx="7" fill="var(--pale)"/><circle cx="89.0" cy="301" r="15" fill="var(--s)"/><rect x="156" y="103" width="98" height="244" rx="16" fill="var(--pl)" stroke="var(--ps)" stroke-width="9"/><text x="205.0" y="193" fill="var(--n)" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="middle">↗</text><rect x="175" y="237" width="60" height="18" rx="7" fill="var(--a)"/><circle cx="205.0" cy="301" r="15" fill="var(--pos)"/><rect x="272" y="103" width="98" height="244" rx="16" fill="var(--pl)" stroke="var(--ps)" stroke-width="9"/><text x="321.0" y="193" fill="var(--n)" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="middle">∿</text><rect x="291" y="237" width="60" height="18" rx="7" fill="var(--pale)"/><circle cx="321.0" cy="301" r="15" fill="var(--s)"/><rect x="388" y="103" width="98" height="244" rx="16" fill="var(--pl)" stroke="var(--ps)" stroke-width="9"/><text x="437.0" y="193" fill="var(--n)" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="middle">↩</text><rect x="407" y="237" width="60" height="18" rx="7" fill="var(--pale)"/><circle cx="437.0" cy="301" r="15" fill="var(--s)"/><path fill="var(--a)" d="M222 383 H290 L312 405 L290 427 H222 L200 405 Z"/><text x="256" y="414" fill="var(--n)" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">MODE</text></g></svg>