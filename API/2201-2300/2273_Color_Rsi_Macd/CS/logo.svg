<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description"><title id="title">Color Rsi Macd strategy logo for C#</title><desc id="description">Four-position MACD mode dial with zero, signal, histogram, and turn pictograms.</desc><style>:root{color-scheme:light dark;--p:hsl(195 44% 39%);--pl:hsl(195 52% 72%);--ps:hsl(195 44% 24%);--s:hsl(327 67% 43%);--sl:hsl(327 75% 72%);--ss:hsl(327 67% 27%);--a:hsl(71 56% 49%);--pos:hsl(148 47% 39%);--neg:hsl(5 59% 52%);--v:hsl(129 48% 45%);--n:#243538;--pale:#cbd7d4;}.language-mark{fill:#17323d;opacity:.085}.python-upper{fill:#2874a6;opacity:.085}.python-lower{fill:#aa8108;opacity:.085}@media(prefers-color-scheme:dark){:root{--p:hsl(195 49% 67%);--pl:hsl(195 54% 82%);--ps:hsl(195 40% 49%);--s:hsl(327 73% 66%);--sl:hsl(327 79% 81%);--ss:hsl(327 64% 45%);--a:hsl(71 62% 70%);--pos:hsl(148 51% 62%);--neg:hsl(5 75% 70%);--v:hsl(129 58% 69%);--n:#edf3f1;--pale:#70817c;}.language-mark{fill:#edf6f3;opacity:.105}.python-upper{fill:#7ec5ed;opacity:.105}.python-lower{fill:#f1ca50;opacity:.105}}</style><g class="language-mark" aria-hidden="true"><path d="M327 108 A180 210 0 1 0 327 404 L278 348 A110 130 0 1 1 278 164 Z"/><path d="M342 54 L397 54 L367 458 L312 458 Z M432 54 L487 54 L457 458 L402 458 Z M301 172 L499 172 L493 232 L295 232 Z M289 285 L487 285 L481 345 L283 345 Z"/></g><g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><text x="256" y="48" fill="var(--n)" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">MACD: 4 MODES</text><rect x="40" y="103" width="98" height="244" rx="16" fill="var(--pl)" stroke="var(--ps)" stroke-width="9"/><text x="89.0" y="193" fill="var(--n)" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="middle">0</text><rect x="59" y="237" width="60" height="18" rx="7" fill="var(--pale)"/><circle cx="89.0" cy="301" r="15" fill="var(--s)"/><rect x="156" y="103" width="98" height="244" rx="1