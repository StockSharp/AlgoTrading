<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description"><title id="title">Candels High Open strategy logo for Python</title><desc id="description">Two enlarged candles align their open notch exactly with the high and low caps.</desc><style>:root{color-scheme:light dark;--p:hsl(167 47% 39%);--pl:hsl(167 55% 72%);--ps:hsl(167 47% 24%);--s:hsl(278 51% 43%);--sl:hsl(278 59% 72%);--ss:hsl(278 51% 27%);--a:hsl(7 56% 49%);--pos:hsl(148 47% 39%);--neg:hsl(5 59% 52%);--v:hsl(104 48% 45%);--n:#243538;--pale:#cbd7d4;}.language-mark{fill:#17323d;opacity:.085}.python-upper{fill:#2874a6;opacity:.085}.python-lower{fill:#aa8108;opacity:.085}@media(prefers-color-scheme:dark){:root{--p:hsl(167 52% 67%);--pl:hsl(167 57% 82%);--ps:hsl(167 43% 49%);--s:hsl(278 57% 66%);--sl:hsl(278 63% 81%);--ss:hsl(278 48% 45%);--a:hsl(7 62% 70%);--pos:hsl(148 51% 62%);--neg:hsl(5 75% 70%);--v:hsl(104 58% 69%);--n:#edf3f1;--pale:#70817c;}.language-mark{fill:#edf6f3;opacity:.105}.python-upper{fill:#7ec5ed;opacity:.105}.python-lower{fill:#f1ca50;opacity:.105}}</style><g aria-hidden="true"><path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z"/><path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)"/></g><g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" stroke-width="11" d="M63 113 H214 M298 399 H449"/><path stroke="var(--neg)" stroke-width="10" d="M139.0 113 V387"/><rect x="87" y="143.14" width="104" height="213.72" rx="5" fill="var(--neg)"/><path stroke="var(--pos)" stroke-width="10" d="M373.0 125 V399"/><rect x="321" y="155.14" width="104" height="213.72" rx="5" fill="var(--pos)"/><path fill="var(--a)" d="M53 94 H220 V132 H53 Z M291 380 H459 V418 H291 Z"/><text x="137" y="88" fill="var(--n)" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">OPEN = HIGH</text><text x="375" y="452" fill="var(--n)" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">OPEN = LOW</text></g></svg>