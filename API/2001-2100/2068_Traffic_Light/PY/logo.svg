<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description"><title id="title">Traffic Light strategy logo for Python</title><desc id="description">A literal traffic light separates stop, wait, and go signals.</desc><style>:root{color-scheme:light dark;--p:hsl(237 50% 39%);--pl:hsl(237 58% 72%);--ps:hsl(237 50% 24%);--s:hsl(32 66% 43%);--sl:hsl(32 74% 72%);--ss:hsl(32 66% 27%);--a:hsl(86 56% 49%);--pos:hsl(148 47% 39%);--neg:hsl(5 59% 52%);--v:hsl(160 48% 45%);--n:#243538;--pale:#cbd7d4;}.language-mark{fill:#17323d;opacity:.085}.python-upper{fill:#2874a6;opacity:.085}.python-lower{fill:#aa8108;opacity:.085}@media(prefers-color-scheme:dark){:root{--p:hsl(237 55% 67%);--pl:hsl(237 60% 82%);--ps:hsl(237 46% 49%);--s:hsl(32 72% 66%);--sl:hsl(32 78% 81%);--ss:hsl(32 63% 45%);--a:hsl(86 62% 70%);--pos:hsl(148 51% 62%);--neg:hsl(5 75% 70%);--v:hsl(160 58% 69%);--n:#edf3f1;--pale:#70817c;}.language-mark{fill:#edf6f3;opacity:.105}.python-upper{fill:#7ec5ed;opacity:.105}.python-lower{fill:#f1ca50;opacity:.105}}</style><g aria-hidden="true"><path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z"/><path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)"/></g><g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path fill="var(--ps)" d="M145 46 H367 V466 H145 Z"/><path fill="var(--pale)" d="M184 75 H328 V437 H184 Z"/><circle fill="var(--neg)" cx="256" cy="150" r="55"/><circle fill="var(--s)" cx="256" cy="256" r="55"/><circle fill="var(--pos)" cx="256" cy="362" r="55"/><path fill="var(--n)" d="M367 118 H453 V150 H367 Z M367 240 H421 V272 H367 Z M367 346 H470 V378 H367 Z"/></g></svg>
