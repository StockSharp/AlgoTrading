      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #f2765f; }
      .primary-light { fill: #ffa18a; }
      .primary-shade { fill: #c64b3d; }
      .secondary { fill: #54bcc3; }
      .secondary-light { fill: #94dde0; }
      .secondary-shade { fill: #2c8b93; }
      .accent { fill: #f3c65e; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

