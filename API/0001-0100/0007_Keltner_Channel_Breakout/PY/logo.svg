<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Keltner Channel Breakout strategy logo for Python</title>
  <desc id="description">A compressed bolt opens a flexible tunnel and carries its force beyond the channel.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
