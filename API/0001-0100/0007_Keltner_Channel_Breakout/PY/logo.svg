    .primary { fill: #d6553f; }
    .primary-light { fill: #f18a6e; }
    .primary-shade { fill: #aa372b; }
    .secondary { fill: #257e86; }
    .secondary-light { fill: #72bec2; }
    .secondary-shade { fill: #175b63; }
    .accent { fill: #e4ad3e; }
    .neutral { fill: #26383f; }
