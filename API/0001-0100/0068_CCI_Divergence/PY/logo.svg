<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">CCI Divergence strategy logo for Python</title>
  <desc id="description">Two synchronized charts show price making a lower low while CCI turns upward to a higher low between its threshold rails.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
