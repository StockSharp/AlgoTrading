<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">CCI Divergence strategy logo for C#</title>
  <desc id="description">A mountain flag rises while a calibrated compass needle turns toward the opposite extreme.</desc>
  <style>
