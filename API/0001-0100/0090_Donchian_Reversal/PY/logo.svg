<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Donchian Reversal strategy logo for Python</title>
  <desc id="description">A boomerang briefly leaves the price canyon, catches the outer wall, and returns through the channel gate.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
