<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OBV Breakout strategy logo for Python</title>
  <desc id="description">Accumulated flow fills a reservoir until buying pressure breaks the dam.</desc>

  <defs>
    <clipPath id="badge-clip">
      <circle cx="256" cy="256" r="232" />
    </clipPath>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }

    .badge {
      fill: #f4f7f8;
      stroke: #277785;
    }

    .badge-fill {
      fill: #f4f7f8;
    }

    .badge-stroke {
      stroke: #f4f7f8;
    }

    .language-mark {
      fill: #17364a;
      opacity: 0.06;
    }

    .python-upper {
      fill: #2874a6;
      opacity: 0.09;
    }

    .python-lower {
      fill: #a77b00;
      opacity: 0.09;
    }

    .python-eye {
      fill: #f4f7f8;
    }

    .accent-fill {
      fill: #079b7e;
    }

    .accent-stroke {
      stroke: #079b7e;
    }

    .solid-fill {
      fill: #17364a;
    }

    .solid-stroke {
      stroke: #17364a;
    }

    .muted-fill {
      fill: #526b78;
    }

    .muted-stroke {
      stroke: #526b78;
    }

    .warm-fill {
      fill: #d97706;
    }

    .warm-stroke {
      stroke: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      .badge {
        fill: #0d2638;
        stroke: #277785;
      }

      .badge-fill {
        fill: #0d2638;
      }

      .badge-stroke {
        stroke: #0d2638;
      }

      .language-mark {
        fill: #edf2f3;
        opacity: 0.07;
      }

      .python-upper {
        fill: #79b7df;
        opacity: 0.1;
      }

      .python-lower {
        fill: #f0c84b;
        opacity: 0.1;
      }

      .python-eye {
        fill: #0d2638;
      }

      .accent-fill {
        fill: #43d6b1;
      }

      .accent-stroke {
        stroke: #43d6b1;
      }

      .solid-fill {
        fill: #edf2f3;
      }

      .solid-stroke {
        stroke: #edf2f3;
      }

      .muted-fill {
        fill: #8fa2aa;
      }

      .muted-stroke {
        stroke: #8fa2aa;
      }

      .warm-fill {
        fill: #f6b73c;
      }

      .warm-stroke {
        stroke: #f6b73c;
      }
    }
  </style>

  <circle class="badge" cx="256" cy="256" r="240" stroke-width="12" />

  <g clip-path="url(#badge-clip)">
    <!-- The implementation language stays visible as a quiet background watermark. -->
    <g aria-hidden="true">
      <path class="python-upper" d="M151 54 C151 32 169 14 191 14 H286 C310 14 329 33 329 57 V148 C329 172 310 191 286 191 H212 C187 191 167 211 167 236 V258 H111 C87 258 68 239 68 215 V181 C68 157 87 138 111 138 H151 Z" />
      <path class="python-lower" d="M151 54 C151 32 169 14 191 14 H286 C310 14 329 33 329 57 V148 C329 172 310 191 286 191 H212 C187 191 167 211 167 236 V258 H111 C87 258 68 239 68 215 V181 C68 157 87 138 111 138 H151 Z" transform="rotate(180 256 256)" />
      <circle class="python-eye" cx="278" cy="67" r="11" />
      <circle class="python-eye" cx="234" cy="445" r="11" />
    </g>

    <!-- Strategy metaphor. -->
    <path class="solid-fill" d="M345 119 H385 V394 H345 Z" />
    <path class="solid-stroke" d="M68 375 C141 349 203 381 274 348 C302 335 324 318 345 295" fill="none" stroke-width="18" stroke-linecap="round" />
    <path class="accent-fill" d="M68 248 C131 226 199 256 264 232 C302 218 329 194 345 170 V346 C319 373 287 392 241 402 H68 Z" />
    <path class="accent-stroke" d="M385 234 C414 231 435 210 453 178" fill="none" stroke-width="18" stroke-linecap="round" />
    <path class="accent-fill" d="M465 150 L429 179 L464 192 Z" />
    <path class="warm-fill" d="M354 241 L374 218 L390 244 L376 259 Z M350 286 L370 267 L387 290 L370 307 Z" />
  </g>
</svg>
