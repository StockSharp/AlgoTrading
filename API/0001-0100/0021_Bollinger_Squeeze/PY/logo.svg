<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bollinger Squeeze strategy logo for Python</title>
  <desc id="description">Opposing plates compress a solid spring until its stored energy escapes.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #596d7b; } .primary-light { fill: #9cabb3; } .primary-shade { fill: #394a54; }
    .secondary { fill: #b84978; } .secondary-light { fill: #e384ad; } .secondary-shade { fill: #863154; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #99abb4; } .primary-light { fill: #cfd9dc; } .primary-shade { fill: #687b83; }
      .secondary { fill: #e36da0; } .secondary-light { fill: #ffacd0; } .secondary-shade { fill: #ae4778; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
