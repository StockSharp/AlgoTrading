<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">MACD Zero Cross strategy logo for Python</title>
  <desc id="description">A weighted pendulum gains direction as it crosses the neutral center gate.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #a14c86; } .primary-light { fill: #d08cba; } .primary-shade { fill: #77345f; }
    .secondary { fill: #596d7b; } .secondary-light { fill: #9cabb3; } .secondary-shade { fill: #394a54; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #d079b6; } .primary-light { fill: #efadd2; } .primary-shade { fill: #a4508a; }
      .secondary { fill: #99abb4; } .secondary-light { fill: #cfd9dc; } .secondary-shade { fill: #687b83; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
