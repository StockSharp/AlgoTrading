<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Stochastic RSI Cross strategy logo for C#</title>
  <desc id="description">Two orbiting signals intersect inside a calibrated target.</desc>

  <defs>
    <clipPath id="badge-clip">
      <circle cx="256" cy="256" r="232" />
    </clipPath>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }

    .badge {
      fill: #f4f7f8;
      stroke: #277785;
    }

    .badge-fill {
      fill: #f4f7f8;
    }

    .badge-stroke {
      stroke: #f4f7f8;
    }

    .language-mark {
      fill: #17364a;
      opacity: 0.06;
    }

    .python-upper {
      fill: #2874a6;
      opacity: 0.09;
    }

    .python-lower {
      fill: #a77b00;
      opacity: 0.09;
    }

    .python-eye {
      fill: #f4f7f8;
    }

    .accent-fill {
      fill: #079b7e;
    }

    .accent-stroke {
      stroke: #079b7e;
    }

    .solid-fill {
      fill: #17364a;
    }

    .solid-stroke {
      stroke: #17364a;
    }

    .muted-fill {
      fill: #526b78;
    }

    .muted-stroke {
      stroke: #526b78;
    }

    .warm-fill {
      fill: #d97706;
    }

    .warm-stroke {
      stroke: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      .badge {
        fill: #0d2638;
        stroke: #277785;
      }

      .badge-fill {
        fill: #0d2638;
      }

      .badge-stroke {
        stroke: #0d2638;
      }

      .language-mark {
        fill: #edf2f3;
        opacity: 0.07;
      }

      .python-upper {
        fill: #79b7df;
        opacity: 0.1;
      }

      .python-lower {
        fill: #f0c84b;
        opacity: 0.1;
      }

      .python-eye {
        fill: #0d2638;
      }

      .accent-fill {
        fill: #43d6b1;
      }

      .accent-stroke {
        stroke: #43d6b1;
      }

      .solid-fill {
        fill: #edf2f3;
      }

      .solid-stroke {
        stroke: #edf2f3;
      }

      .muted-fill {
        fill: #8fa2aa;
      }

      .muted-stroke {
        stroke: #8fa2aa;
      }

      .warm-fill {
        fill: #f6b73c;
      }

      .warm-stroke {
        stroke: #f6b73c;
      }
    }
  </style>

  <circle class="badge" cx="256" cy="256" r="240" stroke-width="12" />

  <g clip-path="url(#badge-clip)">
    <!-- The implementation language stays visible as a quiet background watermark. -->
    <text class="language-mark" x="256" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="360" font-weight="800" letter-spacing="-18" text-anchor="middle" aria-hidden="true">C#</text>

    <!-- Strategy metaphor. -->
    <circle class="muted-stroke badge-fill" cx="256" cy="256" r="130" stroke-width="12" />
    <ellipse class="accent-stroke" cx="256" cy="256" rx="172" ry="72" fill="none" stroke-width="16" transform="rotate(28 256 256)" />
    <ellipse class="solid-stroke" cx="256" cy="256" rx="172" ry="72" fill="none" stroke-width="16" transform="rotate(-28 256 256)" />
    <circle class="warm-fill" cx="256" cy="256" r="24" />
    <circle class="accent-fill" cx="378" cy="341" r="19" />
    <circle class="solid-fill" cx="378" cy="171" r="19" />
    <path class="muted-stroke" d="M256 102 V134 M256 378 V410 M102 256 H134 M378 256 H410" fill="none" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>
