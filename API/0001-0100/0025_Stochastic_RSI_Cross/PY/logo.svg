<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Stochastic RSI Cross strategy logo for Python</title>
  <desc id="description">Two bounded Stochastic RSI lines cross near the oversold floor and then separate upward.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #0f8a82; } .primary-light { fill: #61cabd; } .primary-shade { fill: #08655f; }
    .secondary { fill: #a14d88; } .secondary-light { fill: #d18dbc; } .secondary-shade { fill: #773560; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #3fc6ba; } .primary-light { fill: #82dfd3; } .primary-shade { fill: #1d9389; }
      .secondary { fill: #d17ab8; } .secondary-light { fill: #efafd4; } .secondary-shade { fill: #a5518c; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
