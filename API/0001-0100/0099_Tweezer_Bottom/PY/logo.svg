<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Tweezer Bottom strategy logo for Python</title>
    <desc id="description">Precision forceps meet at two matching candle lows, clamp the shared bottom, and lift the reversal upward.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
