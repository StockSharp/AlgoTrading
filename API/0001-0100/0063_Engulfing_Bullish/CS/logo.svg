<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bullish Engulfing strategy logo for C#</title>
  <desc id="description">A broad rising shield wraps a smaller bearish candle and converts its remaining pressure into lift.</desc>
