    .secondary { fill: #596f88; } .secondary-light { fill: #9aafc1; } .secondary-shade { fill: #394f66; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
