<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bollinger Percent B Reversion strategy logo for C#</title>
  <desc id="description">A measured slider stretches beyond its envelope and is reeled back inside.</desc>
  <style>
    :root { color-scheme: light dark; }
