      .secondary { fill: #8eabc3; } .secondary-light { fill: #c0d3e1; } .secondary-shade { fill: #607f9d; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
