<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Implied Volatility Spike strategy logo for Python</title>
  <desc id="description">A lightning spike drives an options gauge beyond its normal arc.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #5b70a1; } .primary-light { fill: #9eafd0; } .primary-shade { fill: #3c4e7b; }
    .secondary { fill: #c94e5a; } .secondary-light { fill: #ef8790; } .secondary-shade { fill: #98333f; }
    .accent { fill: #e5aa3d; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #91a5d7; } .primary-light { fill: #c4ceed; } .primary-shade { fill: #687aaf; }
      .secondary { fill: #f06e78; } .secondary-light { fill: #ffa2aa; } .secondary-shade { fill: #be4753; }
      .accent { fill: #f3ca61; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
