<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Overbought Oversold strategy logo for C#</title>
  <desc id="description">An oscillator elevator shuttles between a hot upper floor and a cool lower floor, reversing at each extreme.</desc>
  <style>
    :root { color-scheme: light dark; }
