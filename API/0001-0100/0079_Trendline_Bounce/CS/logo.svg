<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Trendline Bounce strategy logo for C#</title>
  <desc id="description">A loaded wheel strikes an inclined trend ramp and rebounds forward without losing the direction of travel.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
