<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Williams Percent R strategy logo for Python</title>
  <desc id="description">A faceted slingshot stores force at an extreme and releases it into direction.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #88563a; } .primary-light { fill: #bd8962; } .primary-shade { fill: #603c29; }
    .secondary { fill: #1a8a83; } .secondary-light { fill: #68cabe; } .secondary-shade { fill: #0f655f; }
    .accent { fill: #dfa13b; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #c18a65; } .primary-light { fill: #e3b28f; } .primary-shade { fill: #8e5d42; }
      .secondary { fill: #48c7bb; } .secondary-light { fill: #88e1d6; } .secondary-shade { fill: #23948a; }
      .accent { fill: #f1c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
  <g aria-hidden="true">
