      .secondary { fill: #43c6ba; } .secondary-light { fill: #86e0d4; } .secondary-shade { fill: #20938a; }
      .accent { fill: #f2c55e; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
