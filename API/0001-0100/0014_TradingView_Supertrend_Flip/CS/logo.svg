    .secondary { fill: #178a82; } .secondary-light { fill: #67cabe; } .secondary-shade { fill: #0d655f; }
    .accent { fill: #dfa33c; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
