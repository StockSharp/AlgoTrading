<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Supertrend Flip strategy logo for C#</title>
  <desc id="description">A pressure wedge drives a hinged plate from its old level into a new direction.</desc>
  <style>
    :root { color-scheme: light dark; }
