<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Supertrend Flip strategy logo for Python</title>
  <desc id="description">A pressure wedge drives a hinged plate from its old level into a new direction.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #576fa6; } .primary-light { fill: #98a9d2; } .primary-shade { fill: #3b4f82; }
    .secondary { fill: #178a82; } .secondary-light { fill: #67cabe; } .secondary-shade { fill: #0d655f; }
    .accent { fill: #dfa33c; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #8da4dc; } .primary-light { fill: #c0caed; } .primary-shade { fill: #627ab5; }
      .secondary { fill: #43c6ba; } .secondary-light { fill: #86e0d4; } .secondary-shade { fill: #20938a; }
      .accent { fill: #f2c55e; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
