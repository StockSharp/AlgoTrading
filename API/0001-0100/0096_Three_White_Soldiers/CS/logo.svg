<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Three White Soldiers strategy logo for C#</title>
  <desc id="description">Three armored bullish guards advance in formation, each shield and spear standing higher than the last.</desc>
  <style>
