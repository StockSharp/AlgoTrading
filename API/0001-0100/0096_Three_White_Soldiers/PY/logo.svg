  <title id="title">Three White Soldiers strategy logo for Python</title>
  <desc id="description">Three armored bullish guards advance in formation, each shield and spear standing higher than the last.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
