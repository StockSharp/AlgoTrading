<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Heikin Ashi Consecutive strategy logo for C#</title>
  <desc id="description">Balanced solid steps build a stable consecutive climb.</desc>
  <style>
