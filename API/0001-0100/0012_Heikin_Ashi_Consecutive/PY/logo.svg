    <path class="primary-light" d="M43 378 L87 349 L209 349 L165 378 Z" />
    <path class="primary" d="M165 291 L287 291 L287 378 L165 378 Z" />
    <path class="primary-light" d="M165 291 L209 262 L331 262 L287 291 Z" />
