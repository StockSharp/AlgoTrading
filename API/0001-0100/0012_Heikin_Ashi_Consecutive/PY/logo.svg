<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Heikin Ashi Consecutive strategy logo for Python</title>
  <desc id="description">Balanced solid steps build a stable consecutive climb.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #168a83; } .primary-light { fill: #65cbbf; } .primary-shade { fill: #0d665f; }
    .secondary { fill: #526f84; } .secondary-light { fill: #94aabc; } .secondary-shade { fill: #344d60; }
    .accent { fill: #dfa13a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #43c7bb; } .primary-light { fill: #87e1d6; } .primary-shade { fill: #20948a; }
      .secondary { fill: #88a9c1; } .secondary-light { fill: #bfd1df; } .secondary-shade { fill: #5b7f99; }
      .accent { fill: #f2c35d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
  <g aria-hidden="true">
