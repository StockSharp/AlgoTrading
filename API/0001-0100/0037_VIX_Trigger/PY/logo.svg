      .secondary { fill: #f06e78; } .secondary-light { fill: #ffa2aa; } .secondary-shade { fill: #be4753; }
      .accent { fill: #f3ca61; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
