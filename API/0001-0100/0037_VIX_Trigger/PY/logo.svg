<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">VIX Trigger strategy logo for Python</title>
  <desc id="description">A sharp storm bolt strikes a pressure alarm and trips its warning mechanism.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #596f88; } .primary-light { fill: #9aafc1; } .primary-shade { fill: #394f66; }
    .secondary { fill: #c84e5a; } .secondary-light { fill: #ef8790; } .secondary-shade { fill: #97333f; }
    .accent { fill: #e5aa3d; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
