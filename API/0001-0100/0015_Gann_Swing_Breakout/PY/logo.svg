    .primary { fill: #9b4b86; } .primary-light { fill: #cb87b7; } .primary-shade { fill: #71345f; }
    .secondary { fill: #566a76; } .secondary-light { fill: #9aa8ae; } .secondary-shade { fill: #36464e; }
    .accent { fill: #e09d38; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
