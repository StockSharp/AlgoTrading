      .secondary { fill: #9aabb2; } .secondary-light { fill: #d0d9db; } .secondary-shade { fill: #687b82; }
      .accent { fill: #f1c25c; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
