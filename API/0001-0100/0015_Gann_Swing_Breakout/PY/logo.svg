  <title id="title">Gann Swing Breakout strategy logo for Python</title>
  <desc id="description">A weighted pendulum gathers a swing and breaks a rigid gate at impact.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
