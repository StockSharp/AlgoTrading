<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Double Bottom strategy logo for Python</title>
  <desc id="description">Two matching stone basins absorb repeated pressure before a springboard launches from their shared neckline.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
