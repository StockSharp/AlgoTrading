<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Double Bottom strategy logo for C#</title>
  <desc id="description">A literal W-shaped price path touches two equal lows and exits upward from the second bottom.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #16875f; } .primary-light { fill: #6bc49f; } .primary-shade { fill: #0d5b42; }
    .secondary { fill: #357da8; } .secondary-light { fill: #8bc5df; } .secondary-shade { fill: #24536e; }
    .accent { fill: #efad32; } .positive { fill: #269869; } .positive-light { fill: #82d0aa; }
    .negative { fill: #c94f5f; } .negative-light { fill: #ef909b; }
    .violet { fill: #705ca3; } .violet-light { fill: #b1a0d3; }
    .neutral { fill: #27373a; } .pale { fill: #c7d9d2; } .shadow { fill: #14231f; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #4dcc96; } .primary-light { fill: #9be2c3; } .primary-shade { fill: #27966d; }
      .secondary { fill: #74b9df; } .secondary-light { fill: #b9ddf0; } .secondary-shade { fill: #477f9f; }
      .accent { fill: #ffd060; } .positive { fill: #5fd49d; } .positive-light { fill: #a8e9c9; }
      .negative { fill: #f37e8b; } .negative-light { fill: #ffb6bf; }
      .violet { fill: #aa98d7; } .violet-light { fill: #d4c8ec; }
      .neutral { fill: #e8f1ed; } .pale { fill: #71877f; } .shadow { fill: #020a07; opacity: 0.34; }
    }
  </style>
