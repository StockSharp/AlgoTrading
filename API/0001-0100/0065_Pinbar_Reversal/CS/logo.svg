<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Pinbar Reversal strategy logo for C#</title>
  <desc id="description">A long pin candle loads a curved springboard and releases price back against the incoming slope.</desc>
  <style>
