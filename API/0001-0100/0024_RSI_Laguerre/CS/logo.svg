  <title id="title">Laguerre RSI strategy logo for C#</title>
  <desc id="description">A four-stage filter turns a jagged RSI input into a smooth bounded oscillator output.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #5c70a2; } .primary-light { fill: #9faed0; } .primary-shade { fill: #3d4f7c; }
    .secondary { fill: #158a82; } .secondary-light { fill: #67cabe; } .secondary-shade { fill: #0d655f; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
