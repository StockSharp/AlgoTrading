<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Inside Bar Breakout strategy logo for Python</title>
  <desc id="description">A small candle grows inside a parent cage, cracks its roof, and escapes through the newly opened range.</desc>
  <style>
    :root { color-scheme: light dark; }
