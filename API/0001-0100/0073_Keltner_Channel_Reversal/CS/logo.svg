<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Keltner Channel Reversal strategy logo for C#</title>
  <desc id="description">A narrow canoe touches the outer riverbank, pivots on its paddle, and returns toward the channel center.</desc>
  <style>
