<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OBV Divergence strategy logo for C#</title>
  <desc id="description">Price reaches a lower low while the cumulative OBV staircase holds a higher low at the same two time points.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
