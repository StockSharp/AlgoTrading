<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Moving Average Crossover strategy logo for C#</title>
  <desc id="description">Two broad directional ribbons exchange levels at a clean crossover.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
    .slow { fill: #cf4455; }
    .slow-light { fill: #f07c72; }
    .slow-shade { fill: #a92f42; }
    .fast { fill: #078b84; }
    .fast-light { fill: #56c9b9; }
    .fast-fold { fill: #056963; }
    .overlap-shadow { fill: #172f36; opacity: 0.2; }

    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .slow { fill: #f0646c; }
      .slow-light { fill: #ff9b88; }
      .slow-shade { fill: #c44352; }
      .fast { fill: #35bdb2; }
      .fast-light { fill: #79dfd0; }
      .fast-fold { fill: #168e87; }
      .overlap-shadow { fill: #02090c; opacity: 0.34; }
    }
  </style>

  <text class="language-mark" x="247" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="316" font-weight="800" letter-spacing="-20" text-anchor="middle" aria-hidden="true">C#</text>

  <!-- The slower ribbon changes direction underneath the faster one. -->
  <path class="slow" d="M38 104 C138 88 200 132 249 200 C300 271 343 337 426 358 L410 326 L489 374 L427 442 L432 405 C314 381 259 310 212 245 C170 187 131 161 44 176 Z" />
  <path class="slow-light" d="M58 117 C140 106 189 143 230 200 C258 239 281 277 312 310 L294 328 C262 296 236 254 208 216 C173 168 137 149 53 160 Z" />
  <path class="slow-shade" d="M303 329 C343 356 380 370 429 377 L423 405 C370 395 334 378 291 347 Z" />

  <!-- A single shadow explains which ribbon passes above the other. -->
  <path class="overlap-shadow" d="M190 327 C214 307 234 286 252 263 L294 296 C274 321 253 345 226 367 Z" />

  <!-- The faster ribbon overtakes, rises, and resolves into one directional point. -->
  <path class="fast" d="M43 392 C133 372 184 335 231 282 C288 218 319 146 407 88 L376 74 L489 45 L459 158 L439 119 C368 166 333 242 276 307 C224 367 169 415 70 458 Z" />
  <path class="fast-light" d="M70 401 C144 381 189 347 231 299 C283 240 314 169 397 109 L419 97 C337 154 307 226 254 286 C208 338 160 379 80 425 Z" />
  <path class="fast-fold" d="M407 88 L489 45 L459 158 L439 119 L448 87 Z" />
</svg>
