<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bearish Engulfing strategy logo for Python</title>
  <desc id="description">A broad descending shield closes around a smaller bullish candle and redirects its lift into a fall.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
