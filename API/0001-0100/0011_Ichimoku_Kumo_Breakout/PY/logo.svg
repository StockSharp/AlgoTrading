<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Ichimoku Kumo Breakout strategy logo for Python</title>
  <desc id="description">A concentrated light wedge pierces layered cloud cover and reaches clear space.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #d2693f; }
    .primary-light { fill: #f09a70; }
    .primary-shade { fill: #a7462b; }
    .secondary { fill: #6b6fa2; }
    .secondary-light { fill: #aaaed0; }
    .secondary-shade { fill: #4b4f7d; }
    .accent { fill: #e5ad3e; }
    .neutral { fill: #29383f; }
    .shadow { fill: #17252b; opacity: 0.22; }

    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #f1845e; }
      .primary-light { fill: #ffae89; }
      .primary-shade { fill: #c35b3f; }
      .secondary { fill: #9c9fd1; }
      .secondary-light { fill: #c9cbed; }
      .secondary-shade { fill: #7377aa; }
      .accent { fill: #f3ca62; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

