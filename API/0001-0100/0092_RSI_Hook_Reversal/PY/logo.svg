  <title id="title">RSI Hook Reversal strategy logo for Python</title>
  <desc id="description">A fishing hook catches the RSI ribbon at an extreme and lifts it back toward the middle waterline.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
