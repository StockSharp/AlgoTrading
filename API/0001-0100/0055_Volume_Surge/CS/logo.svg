<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Volume Surge strategy logo for C#</title>
  <desc id="description">Literal volume columns rise bar by bar and culminate in one oversized upward surge.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #5c4aae; } .primary-light { fill: #a798e0; } .primary-shade { fill: #382b78; }
    .secondary { fill: #1d8fbd; } .secondary-light { fill: #71c8e5; } .secondary-shade { fill: #145a79; }
    .accent { fill: #efbd32; } .positive { fill: #7cae32; } .positive-light { fill: #b5d86e; }
    .negative { fill: #c04778; } .negative-light { fill: #ec8eae; }
    .violet { fill: #7b59c5; } .violet-light { fill: #bca7e8; }
    .neutral { fill: #273444; } .pale { fill: #cad8e5; } .shadow { fill: #151d29; opacity: 0.23; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #9a88ea; } .primary-light { fill: #d0c7f7; } .primary-shade { fill: #6754b5; }
      .secondary { fill: #50bfe7; } .secondary-light { fill: #a4ddf1; } .secondary-shade { fill: #277fa1; }
      .accent { fill: #ffd45d; } .positive { fill: #a9d75a; } .positive-light { fill: #d2ec99; }
      .negative { fill: #ef79a1; } .negative-light { fill: #ffb2ca; }
      .violet { fill: #af96ef; } .violet-light { fill: #d9cef9; }
      .neutral { fill: #e9f1f7; } .pale { fill: #71879a; } .shadow { fill: #02070d; opacity: 0.35; }
    }
  </style>
