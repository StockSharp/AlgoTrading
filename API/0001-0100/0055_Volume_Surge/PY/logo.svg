    <path class="primary" d="M119 286 L175 286 L175 424 L119 424 Z" />
    <path class="violet" d="M190 232 L246 232 L246 424 L190 424 Z" />
    <path class="secondary" d="M261 169 L317 169 L317 424 L261 424 Z" />
    <path class="secondary-light" d="M332 95 L388 95 L388 424 L332 424 Z" />
    <path class="primary-light" d="M61 344 L78 344 L78 408 L61 408 Z M132 299 L149 299 L149 408 L132 408 Z M203 245 L220 245 L220 408 L203 408 Z M274 182 L291 182 L291 408 L274 408 Z M345 108 L362 108 L362 408 L345 408 Z" />
