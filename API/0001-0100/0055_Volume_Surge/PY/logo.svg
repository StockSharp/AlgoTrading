<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Volume Surge strategy logo for Python</title>
  <desc id="description">A loaded volume pump compresses ordinary blocks and releases a disproportionately large impulse.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
