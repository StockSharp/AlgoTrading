<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">CCI Breakout strategy logo for Python</title>
  <desc id="description">A rising CCI impulse breaks a split upper threshold while the lower zero rail remains intact beneath it.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #0e8a83; } .primary-light { fill: #61cabd; } .primary-shade { fill: #08655f; }
    .secondary { fill: #5b6e7c; } .secondary-light { fill: #9eacb4; } .secondary-shade { fill: #3b4a54; }
    .accent { fill: #e0a23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #3fc6ba; } .primary-light { fill: #82dfd3; } .primary-shade { fill: #1d9389; }
      .secondary { fill: #9aacb5; } .secondary-light { fill: #d0d9dc; } .secondary-shade { fill: #687b83; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
