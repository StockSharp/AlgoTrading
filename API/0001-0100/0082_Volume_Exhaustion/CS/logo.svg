<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Volume Exhaustion strategy logo for C#</title>
  <desc id="description">An overfilled volume battery spends its final charge in one large pulse, then folds into a reversal.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
