<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Super Trend strategy logo for C#</title>
  <desc id="description">A continuous route climbs across successive ridges and resolves at a higher summit.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #d69334; }
    .primary-light { fill: #f0c269; }
    .primary-shade { fill: #a96720; }
    .secondary { fill: #58708c; }
    .secondary-light { fill: #9aadc0; }
    .secondary-shade { fill: #394d65; }
    .accent { fill: #168b82; }
    .neutral { fill: #29383f; }
    .shadow { fill: #14262c; opacity: 0.22; }

    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #f0b454; }
      .primary-light { fill: #ffd47e; }
      .primary-shade { fill: #c57d2e; }
      .secondary { fill: #8ea9c4; }
      .secondary-light { fill: #bfd0df; }
      .secondary-shade { fill: #627f9c; }
      .accent { fill: #40c6b8; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

