<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Rate of Change Impulse strategy logo for Python</title>
  <desc id="description">A faceted flywheel converts stored rotation into a sudden tangent launch.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #536d82; } .primary-light { fill: #94aabd; } .primary-shade { fill: #344c60; }
    .secondary { fill: #d55543; } .secondary-light { fill: #f18a71; } .secondary-shade { fill: #aa372d; }
    .accent { fill: #dfa13a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #87a9c1; } .primary-light { fill: #bfd1df; } .primary-shade { fill: #5b7e98; }
      .secondary { fill: #f27662; } .secondary-light { fill: #ffa38d; } .secondary-shade { fill: #c54b3e; }
      .accent { fill: #f1c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
