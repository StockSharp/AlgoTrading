<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Triple Moving Average strategy logo for C#</title>
  <desc id="description">Three independent ribbons converge and leave as one reinforced directional route.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
