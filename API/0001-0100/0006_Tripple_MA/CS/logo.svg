      .secondary-light { fill: #c8b9ed; }
      .secondary-shade { fill: #7159ad; }
      .accent { fill: #f1b052; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

