<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Tweezer Top strategy logo for Python</title>
  <desc id="description">Precision forceps meet at two matching candle highs, clamp the shared top, and press the reversal downward.</desc>
  <style>
