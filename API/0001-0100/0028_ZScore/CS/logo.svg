<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Z-Score strategy logo for C#</title>
  <desc id="description">A tilted statistical balance returns its beam toward a neutral fulcrum.</desc>
  <style>
    :root { color-scheme: light dark; }
