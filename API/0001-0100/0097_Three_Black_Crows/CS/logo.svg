  <title id="title">Three Black Crows strategy logo for C#</title>
  <desc id="description">Three dark crows descend from perch to perch, turning the pattern into an unmistakable bearish formation.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
