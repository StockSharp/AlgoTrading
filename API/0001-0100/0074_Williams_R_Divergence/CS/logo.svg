<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Williams Percent R Divergence strategy logo for C#</title>
  <desc id="description">Price prints a lower low while Williams Percent R forms a higher low between its overbought and oversold limits.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
