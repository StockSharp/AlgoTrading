      .primary-light { fill: #83e0d4; }
      .primary-shade { fill: #1d948a; }
      .secondary { fill: #d27ab5; }
      .secondary-light { fill: #efabd2; }
      .secondary-shade { fill: #a74f89; }
      .accent { fill: #f1b258; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

