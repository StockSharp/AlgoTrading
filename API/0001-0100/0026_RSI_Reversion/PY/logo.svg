<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Reversion strategy logo for Python</title>
  <desc id="description">A broad boomerang leaves an extreme edge and folds its motion back toward center.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #b84a78; } .primary-light { fill: #e287ad; } .primary-shade { fill: #873154; }
    .secondary { fill: #168a82; } .secondary-light { fill: #67cabe; } .secondary-shade { fill: #0d655f; }
    .accent { fill: #dfa23a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; } .python-upper { fill: #7ec5ed; opacity: 0.08; } .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #e16ea0; } .primary-light { fill: #ffacd0; } .primary-shade { fill: #ad4778; }
      .secondary { fill: #43c7ba; } .secondary-light { fill: #87e0d5; } .secondary-shade { fill: #20948a; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
