<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ADX Trend strategy logo for Python</title>
  <desc id="description">A solid weather vane locks into a strong directional wind above a stable roofline.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #16849a; }
    .primary-light { fill: #69c4d2; }
    .primary-shade { fill: #0d6074; }
    .secondary { fill: #d4862f; }
    .secondary-light { fill: #f1bb62; }
    .secondary-shade { fill: #a85e1d; }
    .accent { fill: #d84955; }
    .neutral { fill: #27373d; }
    .shadow { fill: #14242a; opacity: 0.22; }

    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #48bfd1; }
      .primary-light { fill: #8cdeE7; }
      .primary-shade { fill: #218da0; }
      .secondary { fill: #f1ac52; }
      .secondary-light { fill: #ffd482; }
      .secondary-shade { fill: #c87a2e; }
      .accent { fill: #f36b73; }
      .neutral { fill: #e4eeeb; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

