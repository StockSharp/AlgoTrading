<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Cumulative Delta Breakout strategy logo for C#</title>
  <desc id="description">Opposing order-flow blocks accumulate in a counter tower until the dominant side breaks its cap.</desc>
  <style>
