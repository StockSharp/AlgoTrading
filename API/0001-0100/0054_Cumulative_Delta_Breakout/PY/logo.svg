<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Cumulative Delta Breakout strategy logo for Python</title>
  <desc id="description">A literal impulse breaks through a brick wall, establishing the reusable visual sign for breakout strategies.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #2867a8; } .primary-light { fill: #79b9e8; } .primary-shade { fill: #174575; }
    .secondary { fill: #a65e43; } .secondary-light { fill: #d9936d; } .secondary-shade { fill: #6e3b2c; }
    .accent { fill: #f2b63f; } .positive { fill: #3e8d6c; } .positive-light { fill: #82c5a8; }
    .negative { fill: #c24e3a; } .negative-light { fill: #ef8b70; }
    .violet { fill: #725fa8; } .violet-light { fill: #ad9dd1; }
    .neutral { fill: #28343f; } .pale { fill: #d9c2aa; } .shadow { fill: #1b2027; opacity: 0.24; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #5db4ee; } .primary-light { fill: #a6d8f7; } .primary-shade { fill: #307daf; }
      .secondary { fill: #d88a64; } .secondary-light { fill: #f2b28c; } .secondary-shade { fill: #9b5c43; }
      .accent { fill: #ffd166; } .positive { fill: #69c79a; } .positive-light { fill: #a8e0c2; }
      .negative { fill: #f4775f; } .negative-light { fill: #ffb19e; }
      .violet { fill: #a99adb; } .violet-light { fill: #d0c5ed; }
      .neutral { fill: #edf2f6; } .pale { fill: #927a68; } .shadow { fill: #02090b; opacity: 0.36; }
    }
  </style>
