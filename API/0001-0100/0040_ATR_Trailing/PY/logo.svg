<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ATR Trailing Stops strategy logo for Python</title>
  <desc id="description">A climber advances while a flexible safety route follows every higher step.</desc>
  <style>
    :root { color-scheme: light dark; }
