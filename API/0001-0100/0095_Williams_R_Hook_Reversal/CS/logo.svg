<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Williams Percent R Hook Reversal strategy logo for C#</title>
  <desc id="description">An ice axe hooks the extreme wall and gives the Williams percent R path a firm point for reversal.</desc>
  <style>
