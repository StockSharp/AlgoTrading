<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Parabolic SAR Reversal strategy logo for Python</title>
  <desc id="description">A price shuttle curves through its orbit as the SAR markers migrate from below the path to above it.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
