<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bollinger Band Reversal strategy logo for Python</title>
  <desc id="description">An elastic market net catches a price ball outside its lower edge and slings it back through the envelope.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
