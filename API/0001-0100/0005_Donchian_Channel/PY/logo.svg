<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Donchian Channel strategy logo for Python</title>
  <desc id="description">A compact sailing hull holds its route through open water between two moving banks.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #15899a; }
    .primary-light { fill: #67c5cf; }
    .primary-shade { fill: #0d6573; }
    .secondary { fill: #355b74; }
    .secondary-light { fill: #7899ab; }
    .secondary-shade { fill: #243f52; }
    .accent { fill: #e09438; }
    .neutral { fill: #26383f; }
    .shadow { fill: #15262c; opacity: 0.22; }

    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #44c3d1; }
      .primary-light { fill: #8cdee5; }
      .primary-shade { fill: #218c9b; }
      .secondary { fill: #709bb7; }
      .secondary-light { fill: #a9c6d4; }
      .secondary-shade { fill: #456d88; }
      .accent { fill: #f2b65c; }
      .neutral { fill: #e5efec; }
      .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>

