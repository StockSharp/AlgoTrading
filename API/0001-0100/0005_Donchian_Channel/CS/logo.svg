<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Donchian Channel strategy logo for C#</title>
  <desc id="description">A compact sailing hull holds its route through open water between two moving banks.</desc>

  <style>
    :root { color-scheme: light dark; }

    .language-mark { fill: #17323d; opacity: 0.07; }
