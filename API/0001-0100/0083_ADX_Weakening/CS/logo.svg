<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ADX Weakening strategy logo for C#</title>
  <desc id="description">A strong directional chain thins link by link until the final connection breaks and the pull sags.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
