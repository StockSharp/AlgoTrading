<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Divergence strategy logo for C#</title>
  <desc id="description">Two paths leave the same pivot but accelerate in opposite directions.</desc>

  <defs>
    <clipPath id="badge-clip">
      <circle cx="256" cy="256" r="232" />
    </clipPath>
  </defs>

  <style>
    :root {
      color-scheme: light dark;
    }

    .badge {
      fill: #f4f7f8;
      stroke: #277785;
    }

    .badge-fill {
      fill: #f4f7f8;
    }

    .badge-stroke {
      stroke: #f4f7f8;
    }

    .language-mark {
      fill: #17364a;
      opacity: 0.06;
    }

    .python-upper {
      fill: #2874a6;
      opacity: 0.09;
    }

    .python-lower {
      fill: #a77b00;
      opacity: 0.09;
    }

    .python-eye {
      fill: #f4f7f8;
    }

    .accent-fill {
      fill: #079b7e;
    }

    .accent-stroke {
      stroke: #079b7e;
    }

    .solid-fill {
      fill: #17364a;
    }

    .solid-stroke {
      stroke: #17364a;
    }

    .muted-fill {
      fill: #526b78;
    }

    .muted-stroke {
      stroke: #526b78;
    }

    .warm-fill {
      fill: #d97706;
    }

    .warm-stroke {
      stroke: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      .badge {
        fill: #0d2638;
        stroke: #277785;
      }

      .badge-fill {
        fill: #0d2638;
      }

      .badge-stroke {
        stroke: #0d2638;
      }

      .language-mark {
        fill: #edf2f3;
        opacity: 0.07;
      }

      .python-upper {
        fill: #79b7df;
        opacity: 0.1;
      }

      .python-lower {
        fill: #f0c84b;
        opacity: 0.1;
      }

      .python-eye {
        fill: #0d2638;
      }

      .accent-fill {
        fill: #43d6b1;
      }

      .accent-stroke {
        stroke: #43d6b1;
      }

      .solid-fill {
        fill: #edf2f3;
      }

      .solid-stroke {
        stroke: #edf2f3;
      }

      .muted-fill {
        fill: #8fa2aa;
      }

      .muted-stroke {
        stroke: #8fa2aa;
      }

      .warm-fill {
        fill: #f6b73c;
      }

      .warm-stroke {
        stroke: #f6b73c;
      }
    }
  </style>

  <circle class="badge" cx="256" cy="256" r="240" stroke-width="12" />

  <g clip-path="url(#badge-clip)">
    <!-- The implementation language stays visible as a quiet background watermark. -->
    <text class="language-mark" x="256" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="360" font-weight="800" letter-spacing="-18" text-anchor="middle" aria-hidden="true">C#</text>

    <!-- Strategy metaphor. -->
    <circle class="warm-fill" cx="151" cy="255" r="23" />
    <path class="accent-stroke" d="M150 255 C218 236 277 184 365 126" fill="none" stroke-width="18" stroke-linecap="round" />
    <path class="solid-stroke" d="M150 255 C219 274 281 328 367 382" fill="none" stroke-width="18" stroke-linecap="round" />
    <path class="accent-fill" d="M408 100 L356 111 L385 153 Z" />
    <path class="solid-fill" d="M410 407 L357 396 L386 355 Z" />
    <path class="muted-stroke" d="M112 131 V381" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 20" />
    <path class="warm-stroke" d="M95 255 H128" fill="none" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
