<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Divergence strategy logo for C#</title>
  <desc id="description">Two aligned charts show price making a lower low while the bounded RSI oscillator makes a higher low.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
