      .secondary { fill: #e776af; } .secondary-light { fill: #ffafd2; } .secondary-shade { fill: #b84d87; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
