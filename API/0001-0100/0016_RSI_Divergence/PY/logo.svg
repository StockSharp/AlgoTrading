<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Divergence strategy logo for Python</title>
  <desc id="description">Two filled routes leave one pivot and accelerate toward opposite outcomes.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #0f8b84; } .primary-light { fill: #62cbbd; } .primary-shade { fill: #096760; }
    .secondary { fill: #c04d83; } .secondary-light { fill: #ed8eb8; } .secondary-shade { fill: #91355f; }
    .accent { fill: #e0a13a; } .neutral { fill: #29393f; } .shadow { fill: #14262c; opacity: 0.22; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #3fc7bb; } .primary-light { fill: #83e0d4; } .primary-shade { fill: #1d948a; }
      .secondary { fill: #e776af; } .secondary-light { fill: #ffafd2; } .secondary-shade { fill: #b84d87; }
      .accent { fill: #f2c45d; } .neutral { fill: #e5efec; } .shadow { fill: #02090b; opacity: 0.34; }
    }
  </style>
