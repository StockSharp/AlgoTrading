    <path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)" />
  </g>
  <g aria-hidden="true">
    <path class="primary-shade" d="M55 232 L135 232 L135 312 L55 312 Z" />
    <circle class="accent" cx="95" cy="272" r="25" />
    <path class="line-primary" d="M130 249 C210 153 339 105 427 157 C489 194 463 285 391 298 C326 309 269 274 226 321 C195 355 222 402 282 401" />
    <g transform="rotate(-36 207 194)"><ellipse class="thin-secondary" cx="178" cy="194" rx="41" ry="23"/><ellipse class="thin-secondary" cx="236" cy="194" rx="41" ry="23"/></g>
    <g transform="rotate(10 354 151)"><ellipse class="thin-secondary" cx="325" cy="151" rx="41" ry="23"/><ellipse class="thin-secondary" cx="383" cy="151" rx="41" ry="23"/></g>
    <g transform="rotate(31 367 291)"><ellipse class="thin-secondary" cx="338" cy="291" rx="41" ry="23"/><ellipse class="thin-secondary" cx="396" cy="291" rx="41" ry="23"/></g>
    <path class="primary" d="M250 369 L313 402 L254 438 L267 410 L267 390 Z" />
  </g>
