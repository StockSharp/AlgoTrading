<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Autocorrelation Reversal strategy logo for C#</title>
  <desc id="description">Repeated same-direction impulses hit a spring wall and rebound as one clear reversal.</desc>
  <style>
