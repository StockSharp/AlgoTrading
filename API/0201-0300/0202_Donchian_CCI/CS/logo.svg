      .line-primary { stroke:#718bc7; } .line-secondary { stroke:#e675a4; } .line-neutral { stroke:#edf1f5; } .line-accent { stroke:#f2c75d; } .thin-primary { stroke:#718bc7; } .thin-secondary { stroke:#e675a4; } .thin-neutral { stroke:#edf1f5; }
    }
