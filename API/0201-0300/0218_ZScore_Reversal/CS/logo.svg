    <path class="primary" d="M88 112 L125 112 L125 135 L88 135 Z M88 245 L125 245 L125 268 L88 268 Z M88 377 L125 377 L125 400 L88 400 Z" />
    <circle class="secondary" cx="176" cy="111" r="32" />
    <circle class="accent" cx="176" cy="256" r="25" />
