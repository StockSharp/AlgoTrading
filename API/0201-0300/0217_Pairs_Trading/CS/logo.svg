<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Pairs Trading strategy logo for C#</title>
  <desc id="description">Two matched boats on parallel waves are linked by an elastic spread tether that draws them back together.</desc>
  <style>
