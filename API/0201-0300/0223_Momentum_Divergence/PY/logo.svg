<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Momentum Divergence strategy logo for Python</title>
  <desc id="description">A price rocket climbs while its confirmation arrow peels downward from the same launch point.</desc>
  <style>
    :root { color-scheme: light dark; }
