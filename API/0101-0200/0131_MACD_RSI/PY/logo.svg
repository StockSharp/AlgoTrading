<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">MACD RSI strategy logo for Python</title>
  <desc id="description">A MACD histogram and crossover feed a bounded RSI gauge, and their agreement releases one directional arrow.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; } .python-upper { fill: #2874a6; opacity: 0.07; } .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #078b84; } .primary-light { fill: #56c9b9; } .primary-shade { fill: #056963; }
    .secondary { fill: #cf4455; } .secondary-light { fill: #f07c72; } .secondary-shade { fill: #a92f42; }
    .accent { fill: #e4a62d; } .positive { fill: #2f936c; } .positive-light { fill: #7bc6a5; } .negative { fill: #c84d4d; } .negative-light { fill: #ef8a80; }
    .violet { fill: #725bb3; } .violet-light { fill: #af9be0; } .neutral { fill: #233842; } .pale { fill: #c8d8d7; } .shadow { fill: #14262c; opacity: 0.22; }
    .line-primary { fill:none; stroke:#078b84; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-secondary { fill:none; stroke:#cf4455; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-neutral { fill:none; stroke:#233842; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-accent { fill:none; stroke:#e4a62d; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
    .thin-primary { fill:none; stroke:#078b84; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    .thin-secondary { fill:none; stroke:#cf4455; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    .thin-neutral { fill:none; stroke:#233842; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill:#edf6f3; opacity:0.08; } .python-upper { fill:#7ec5ed; opacity:0.08; } .python-lower { fill:#f1ca50; opacity:0.08; }
      .primary { fill:#35bdb2; } .primary-light { fill:#79dfd0; } .primary-shade { fill:#168e87; }
      .secondary { fill:#f0646c; } .secondary-light { fill:#ff9b88; } .secondary-shade { fill:#c44352; }
      .accent { fill:#f2c45d; } .positive { fill:#69c79a; } .positive-light { fill:#a8e0c2; } .negative { fill:#f47768; } .negative-light { fill:#ffb09e; }
      .violet { fill:#a99adb; } .violet-light { fill:#d0c5ed; } .neutral { fill:#edf3f1; } .pale { fill:#71848a; } .shadow { fill:#02090b; opacity:0.34; }
      .line-primary { stroke:#35bdb2; } .line-secondary { stroke:#f0646c; } .line-neutral { stroke:#edf3f1; } .line-accent { stroke:#f2c45d; }
      .thin-primary { stroke:#35bdb2; } .thin-secondary { stroke:#f0646c; } .thin-neutral { stroke:#edf3f1; }
    }
  </style>
  <g aria-hidden="true"><path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" /><path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)" /></g>
  <g aria-hidden="true">
    <path class="neutral" d="M42 400 L268 400 L268 420 L42 420 Z" />
    <path class="primary-light" d="M62 330 L94 330 L94 400 L62 400 Z M105 278 L137 278 L137 400 L105 400 Z M148 218 L180 218 L180 400 L148 400 Z M191 252 L223 252 L223 400 L191 400 Z" />
    <path class="line-primary" d="M55 315 C103 292 137 222 177 236 C214 249 225 325 260 318" />
    <path class="line-secondary" d="M55 348 C104 331 139 257 181 268 C220 279 233 347 260 337" />
    <path class="neutral" d="M300 84 L458 84 L458 390 L300 390 Z" />
    <path class="pale" d="M320 112 L438 112 L438 362 L320 362 Z" />
    <path class="secondary-light" d="M320 112 L438 112 L438 158 L320 158 Z M320 316 L438 316 L438 362 L320 362 Z" />
    <path class="line-primary" d="M329 304 C350 296 353 258 374 250 C397 241 402 189 429 166" />
    <path class="primary" d="M402 166 L447 123 L453 183 L432 169 Z" />
    <path class="accent" d="M266 230 L309 230 L309 262 L266 262 Z" />
  </g>
</svg>

