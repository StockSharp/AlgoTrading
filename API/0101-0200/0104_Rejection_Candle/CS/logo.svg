    <path class="secondary" d="M204 248 L280 248 L280 334 L204 334 Z" />
    <path class="secondary-light" d="M216 260 L268 260 L268 279 L216 279 Z" />
    <path class="line-primary" d="M345 146 C420 184 425 285 344 350" />
    <path class="primary" d="M311 331 L348 395 L397 339 L365 348 Z" />
    <path class="accent" d="M226 134 L206 154 L219 163 L239 142 Z M258 136 L277 156 L266 166 L247 145 Z" />
  </g>
