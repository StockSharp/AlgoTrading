<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Keltner Volume strategy logo for C#</title>
  <desc id="description">Expanding volume columns push price out of a flexible Keltner channel, making the band break visibly participation-driven.</desc>
  <style>
    :root { color-scheme: light dark; }
