    .thin-primary { fill:none; stroke:#b24f42; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-secondary { fill:none; stroke:#2a82a4; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-neutral { fill:none; stroke:#2f383e; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
