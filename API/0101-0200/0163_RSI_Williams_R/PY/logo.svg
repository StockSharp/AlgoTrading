<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RSI Williams R strategy logo for Python</title>
  <desc id="description">A broad RSI oscillator and a fast Williams-percent-R depth hook reach the same extreme and trigger one shared reversal.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill:#17323d; opacity:.07; } .python-upper { fill:#2874a6; opacity:.07; } .python-lower { fill:#aa8108; opacity:.07; }
    .primary { fill:#7650a4; } .primary-light { fill:#b59bd4; } .primary-shade { fill:#513370; } .secondary { fill:#198f7c; } .secondary-light { fill:#70cbb8; } .secondary-shade { fill:#106658; }
    .accent { fill:#dda63e; } .positive { fill:#3f8b62; } .positive-light { fill:#88c6a5; } .negative { fill:#c04e5b; } .negative-light { fill:#ed8c96; }
    .violet { fill:#3f70aa; } .violet-light { fill:#8eb4df; } .neutral { fill:#303542; } .pale { fill:#d7cedd; } .shadow { fill:#14262c; opacity:.22; }
    .line-primary { fill:none; stroke:#7650a4; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-secondary { fill:none; stroke:#198f7c; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-neutral { fill:none; stroke:#303542; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-accent { fill:none; stroke:#dda63e; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
    .thin-primary { fill:none; stroke:#7650a4; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-secondary { fill:none; stroke:#198f7c; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-neutral { fill:none; stroke:#303542; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill:#edf6f3; opacity:.08; } .python-upper { fill:#7ec5ed; opacity:.08; } .python-lower { fill:#f1ca50; opacity:.08; }
      .primary { fill:#aa8cdd; } .primary-light { fill:#d1bdeb; } .primary-shade { fill:#7455a7; } .secondary { fill:#45c3aa; } .secondary-light { fill:#91e2d1; } .secondary-shade { fill:#278b78; }
      .accent { fill:#f2ca61; } .positive { fill:#71c795; } .positive-light { fill:#afe0c2; } .negative { fill:#f27786; } .negative-light { fill:#ffb1bb; }
      .violet { fill:#70a9e2; } .violet-light { fill:#b4d3f1; } .neutral { fill:#f0eff5; } .pale { fill:#82778e; } .shadow { fill:#02090b; opacity:.34; }
      .line-primary { stroke:#aa8cdd; } .line-secondary { stroke:#45c3aa; } .line-neutral { stroke:#f0eff5; } .line-accent { stroke:#f2ca61; } .thin-primary { stroke:#aa8cdd; } .thin-secondary { stroke:#45c3aa; } .thin-neutral { stroke:#f0eff5; }
    }
  </style>
  <g aria-hidden="true">
    <path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" />
    <path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)" />
  </g>
  <g aria-hidden="true">
    <path class="primary-shade" d="M52 79 L460 79 L460 111 L52 111 Z M52 409 L460 409 L460 441 L52 441 Z M52 79 L84 79 L84 441 L52 441 Z M428 79 L460 79 L460 441 L428 441 Z" />
    <path class="pale" d="M84 111 L428 111 L428 409 L84 409 Z" />
    <path class="primary-light" d="M84 111 L428 111 L428 151 L84 151 Z M84 369 L428 369 L428 409 L84 409 Z" />
    <path class="line-primary" d="M102 349 C142 376 168 302 208 316 C246 330 264 267 301 245" />
    <circle class="accent" cx="151" cy="340" r="25" />
    <path class="line-secondary" d="M329 136 L329 337 C329 383 381 396 400 356 C410 335 395 316 374 322" />
    <circle class="secondary-light" cx="329" cy="159" r="22" />
    <path class="secondary" d="M363 302 L417 316 L380 355 L378 323 Z" />
    <path class="accent" d="M282 213 L335 237 L290 272 L299 242 Z" />
  </g>
</svg>
