<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Overnight Gap strategy logo for Python</title>
  <desc id="description">Two separated price platforms face each other across a moonlit overnight gap, with a partial retracement arrow bridging the opening move.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #3b5384; } .primary-light { fill: #8b9fcb; } .primary-shade { fill: #293a5d; }
    .secondary { fill: #ba4e79; } .secondary-light { fill: #e68cac; } .secondary-shade { fill: #823653; }
    .accent { fill: #dfa63b; } .positive { fill: #378c6d; } .positive-light { fill: #7bc7aa; }
    .negative { fill: #bd4a4a; } .negative-light { fill: #eb8980; }
    .violet { fill: #765aa8; } .violet-light { fill: #ad9ad1; }
    .neutral { fill: #293640; } .pale { fill: #ced4df; } .shadow { fill: #14262c; opacity: 0.22; }
    .line-primary { fill: none; stroke: #3b5384; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-secondary { fill: none; stroke: #ba4e79; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-neutral { fill: none; stroke: #293640; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-accent { fill: none; stroke: #dfa63b; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .thin-primary { fill: none; stroke: #3b5384; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-secondary { fill: none; stroke: #ba4e79; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-neutral { fill: none; stroke: #293640; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #718bc7; } .primary-light { fill: #b1c1e7; } .primary-shade { fill: #49639a; }
      .secondary { fill: #e675a4; } .secondary-light { fill: #ffacc8; } .secondary-shade { fill: #ac4a73; }
      .accent { fill: #f2c75d; } .positive { fill: #63c49b; } .positive-light { fill: #a4dec2; }
      .negative { fill: #f17470; } .negative-light { fill: #ffada5; }
      .violet { fill: #aa94db; } .violet-light { fill: #d1c2ec; }
      .neutral { fill: #edf1f5; } .pale { fill: #747f92; } .shadow { fill: #02090b; opacity: 0.34; }
      .line-primary { stroke: #718bc7; } .line-secondary { stroke: #e675a4; }
      .line-neutral { stroke: #edf1f5; } .line-accent { stroke: #f2c75d; }
      .thin-primary { stroke: #718bc7; } .thin-secondary { stroke: #e675a4; } .thin-neutral { stroke: #edf1f5; }
    }
  </style>
