<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ADX Volume strategy logo for Python</title>
  <desc id="description">A high ADX power dial crowns a bank of rising volume cylinders, showing trend strength and participation together.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill:#17323d; opacity:.07; } .python-upper { fill:#2874a6; opacity:.07; } .python-lower { fill:#aa8108; opacity:.07; }
    .primary { fill:#2867a8; } .primary-light { fill:#79b9e8; } .primary-shade { fill:#174575; } .secondary { fill:#d87532; } .secondary-light { fill:#f1ad72; } .secondary-shade { fill:#9e4b20; }
    .accent { fill:#e3b93f; } .positive { fill:#3d8b61; } .positive-light { fill:#83c5a3; } .negative { fill:#bd4b43; } .negative-light { fill:#eb8b7d; }
    .violet { fill:#6f62aa; } .violet-light { fill:#aaa0d4; } .neutral { fill:#283743; } .pale { fill:#c9d5df; } .shadow { fill:#14262c; opacity:.22; }
    .line-primary { fill:none; stroke:#2867a8; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-secondary { fill:none; stroke:#d87532; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-neutral { fill:none; stroke:#283743; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-accent { fill:none; stroke:#e3b93f; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
    .thin-primary { fill:none; stroke:#2867a8; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-secondary { fill:none; stroke:#d87532; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-neutral { fill:none; stroke:#283743; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill:#edf6f3; opacity:.08; } .python-upper { fill:#7ec5ed; opacity:.08; } .python-lower { fill:#f1ca50; opacity:.08; }
      .primary { fill:#5db4ee; } .primary-light { fill:#a6d8f7; } .primary-shade { fill:#307daf; } .secondary { fill:#f1a064; } .secondary-light { fill:#ffc394; } .secondary-shade { fill:#b96a3b; }
      .accent { fill:#ffd166; } .positive { fill:#69c793; } .positive-light { fill:#aae0bd; } .negative { fill:#f27769; } .negative-light { fill:#ffb2a3; }
      .violet { fill:#a99bdd; } .violet-light { fill:#d2c8ee; } .neutral { fill:#edf2f6; } .pale { fill:#738797; } .shadow { fill:#02090b; opacity:.34; }
      .line-primary { stroke:#5db4ee; } .line-secondary { stroke:#f1a064; } .line-neutral { stroke:#edf2f6; } .line-accent { stroke:#ffd166; } .thin-primary { stroke:#5db4ee; } .thin-secondary { stroke:#f1a064; } .thin-neutral { stroke:#edf2f6; }
    }
  </style>
  <g aria-hidden="true">
    <path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" />
    <path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)" />
  </g>
  <g aria-hidden="true">
    <path class="neutral" fill-rule="evenodd" d="M70 255 A186 186 0 0 1 442 255 L402 255 A146 146 0 0 0 110 255 Z" />
    <path class="primary-light" d="M99 202 C132 118 208 77 280 91 L273 130 C217 120 159 153 135 216 Z" />
    <path class="accent" d="M278 91 C345 99 403 143 436 205 L399 222 C374 174 329 140 271 130 Z" />
    <path class="line-accent" d="M256 244 L350 134" />
    <path class="accent" d="M236 224 A20 20 0 1 0 276 224 A20 20 0 1 0 236 224 Z" />
    <path class="neutral" d="M59 434 L453 434 L453 454 L59 454 Z" />
    <path class="secondary" d="M83 365 L133 365 L133 434 L83 434 Z M151 327 L201 327 L201 434 L151 434 Z M219 283 L269 283 L269 434 L219 434 Z M287 234 L337 234 L337 434 L287 434 Z M355 188 L405 188 L405 434 L355 434 Z" />
  </g>
</svg>
