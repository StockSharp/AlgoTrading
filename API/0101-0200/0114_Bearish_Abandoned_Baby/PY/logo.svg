<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bearish Abandoned Baby strategy logo for Python</title>
  <desc id="description">A tiny doji sits isolated above two gap-separated candles, marking an abandoned top and a bearish turn.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #b24f42; } .primary-light { fill: #e48b74; } .primary-shade { fill: #7d342c; }
    .secondary { fill: #2a82a4; } .secondary-light { fill: #7bbdd4; } .secondary-shade { fill: #1c5d75; }
    .accent { fill: #dca93e; } .positive { fill: #3c8e68; } .positive-light { fill: #82c8a5; }
    .negative { fill: #b94b4b; } .negative-light { fill: #e98b83; }
    .violet { fill: #745ba8; } .violet-light { fill: #af9ed2; }
    .neutral { fill: #2f383e; } .pale { fill: #d9c9bf; } .shadow { fill: #14262c; opacity: 0.22; }
    .line-primary { fill: none; stroke: #b24f42; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-secondary { fill: none; stroke: #2a82a4; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-neutral { fill: none; stroke: #2f383e; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-accent { fill: none; stroke: #dca93e; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .thin-primary { fill: none; stroke: #b24f42; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-secondary { fill: none; stroke: #2a82a4; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-neutral { fill: none; stroke: #2f383e; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #ed806d; } .primary-light { fill: #f7b09b; } .primary-shade { fill: #a94f43; }
      .secondary { fill: #55b8d7; } .secondary-light { fill: #9ed7e8; } .secondary-shade { fill: #2f819a; }
      .accent { fill: #f2cb61; } .positive { fill: #68c69a; } .positive-light { fill: #a9dfc2; }
      .negative { fill: #ef7474; } .negative-light { fill: #ffb0aa; }
      .violet { fill: #aa97da; } .violet-light { fill: #d1c4ec; }
      .neutral { fill: #eff3f2; } .pale { fill: #8a786e; } .shadow { fill: #02090b; opacity: 0.34; }
      .line-primary { stroke: #ed806d; } .line-secondary { stroke: #55b8d7; }
      .line-neutral { stroke: #eff3f2; } .line-accent { stroke: #f2cb61; }
      .thin-primary { stroke: #ed806d; } .thin-secondary { stroke: #55b8d7; } .thin-neutral { stroke: #eff3f2; }
    }
  </style>
