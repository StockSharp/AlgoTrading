      .secondary { fill: #f0646c; } .secondary-light { fill: #ff9b88; } .secondary-shade { fill: #c44352; }
      .accent { fill: #f2c45d; } .positive { fill: #69c79a; } .positive-light { fill: #a8e0c2; }
      .negative { fill: #f47768; } .negative-light { fill: #ffb09e; }
      .violet { fill: #a99adb; } .violet-light { fill: #d0c5ed; }
      .neutral { fill: #edf3f1; } .pale { fill: #71848a; } .shadow { fill: #02090b; opacity: 0.34; }
      .line-primary { stroke: #35bdb2; } .line-secondary { stroke: #f0646c; }
      .line-neutral { stroke: #edf3f1; } .line-accent { stroke: #f2c45d; }
      .thin-primary { stroke: #35bdb2; } .thin-secondary { stroke: #f0646c; } .thin-neutral { stroke: #edf3f1; }
