<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Turnaround Tuesday strategy logo for C#</title>
  <desc id="description">Two adjacent calendar cards show a Monday selloff turning into a forceful Tuesday rebound.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
