<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bollinger Volume strategy logo for Python</title>
  <desc id="description">A rising volume piston stretches two Bollinger rails apart and launches price through the newly expanded boundary.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill:#17323d; opacity:.07; } .python-upper { fill:#2874a6; opacity:.07; } .python-lower { fill:#aa8108; opacity:.07; }
    .primary { fill:#2867a8; } .primary-light { fill:#79b9e8; } .primary-shade { fill:#174575; } .secondary { fill:#d87532; } .secondary-light { fill:#f1ad72; } .secondary-shade { fill:#9e4b20; }
    .accent { fill:#e3b93f; } .positive { fill:#3d8b61; } .positive-light { fill:#83c5a3; } .negative { fill:#bd4b43; } .negative-light { fill:#eb8b7d; }
    .violet { fill:#6f62aa; } .violet-light { fill:#aaa0d4; } .neutral { fill:#283743; } .pale { fill:#c9d5df; } .shadow { fill:#14262c; opacity:.22; }
    .line-primary { fill:none; stroke:#2867a8; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-secondary { fill:none; stroke:#d87532; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .line-neutral { fill:none; stroke:#283743; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-accent { fill:none; stroke:#e3b93f; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
    .thin-primary { fill:none; stroke:#2867a8; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-secondary { fill:none; stroke:#d87532; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-neutral { fill:none; stroke:#283743; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill:#edf6f3; opacity:.08; } .python-upper { fill:#7ec5ed; opacity:.08; } .python-lower { fill:#f1ca50; opacity:.08; }
      .primary { fill:#5db4ee; } .primary-light { fill:#a6d8f7; } .primary-shade { fill:#307daf; } .secondary { fill:#f1a064; } .secondary-light { fill:#ffc394; } .secondary-shade { fill:#b96a3b; }
      .accent { fill:#ffd166; } .positive { fill:#69c793; } .positive-light { fill:#aae0bd; } .negative { fill:#f27769; } .negative-light { fill:#ffb2a3; }
      .violet { fill:#a99bdd; } .violet-light { fill:#d2c8ee; } .neutral { fill:#edf2f6; } .pale { fill:#738797; } .shadow { fill:#02090b; opacity:.34; }
      .line-primary { stroke:#5db4ee; } .line-secondary { stroke:#f1a064; } .line-neutral { stroke:#edf2f6; } .line-accent { stroke:#ffd166; }
      .thin-primary { stroke:#5db4ee; } .thin-secondary { stroke:#f1a064; } .thin-neutral { stroke:#edf2f6; }
    }
  </style>
  <g aria-hidden="true"><path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z"/><path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)"/></g>
  <g aria-hidden="true">
    <path class="line-primary" d="M43 113 C155 73 345 74 468 122 M43 402 C155 442 345 440 468 392" />
    <path class="primary-light" d="M47 242 C159 216 349 216 464 246 L464 275 C349 245 159 245 47 271 Z" />
    <path class="neutral" d="M72 424 L312 424 L312 446 L72 446 Z" />
    <path class="secondary" d="M91 354 L133 354 L133 424 L91 424 Z M148 315 L190 315 L190 424 L148 424 Z M205 263 L247 263 L247 424 L205 424 Z M262 198 L304 198 L304 424 L262 424 Z" />
    <path class="accent" d="M251 155 L315 155 L315 198 L251 198 Z" />
    <path class="line-secondary" d="M283 177 C331 157 364 127 406 83" />
    <path class="secondary" d="M375 78 L441 43 L423 114 L408 91 Z" />
  </g>
</svg>

