    <path class="pale" d="M66 92 L468 92 L468 158 L66 158 Z" />
    <path class="secondary-light" d="M66 144 L468 144 L468 158 L66 158 Z" />
    <path class="line-primary" d="M76 340 C126 303 154 110 201 106 C242 102 255 238 294 226 C330 215 350 130 386 138 C422 145 439 255 458 330" />
    <path class="line-secondary" d="M76 370 C129 332 168 135 210 128 C252 120 269 258 306 242 C342 226 360 151 397 160 C432 169 444 278 458 354" />
    <path class="secondary" d="M426 331 L464 397 L495 326 L471 342 Z" />
    <path class="accent" d="M187 94 L215 94 L215 120 L187 120 Z M373 126 L401 126 L401 152 L373 152 Z" />
  </g>
</svg>

