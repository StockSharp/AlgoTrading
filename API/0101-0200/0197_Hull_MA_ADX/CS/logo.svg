    .accent { fill:#dda63e; } .positive { fill:#3f8b62; } .positive-light { fill:#88c6a5; } .negative { fill:#c04e5b; } .negative-light { fill:#ed8c96; } .violet { fill:#3f70aa; } .violet-light { fill:#8eb4df; } .neutral { fill:#303542; } .pale { fill:#d7cedd; } .shadow { fill:#14262c; opacity:.22; }
    .line-primary { fill:none; stroke:#7650a4; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-secondary { fill:none; stroke:#198f7c; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-neutral { fill:none; stroke:#303542; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; } .line-accent { fill:none; stroke:#dda63e; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; } .thin-primary { fill:none; stroke:#7650a4; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-secondary { fill:none; stroke:#198f7c; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; } .thin-neutral { fill:none; stroke:#303542; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
    @media (prefers-color-scheme: dark) {
