<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Bullish Abandoned Baby strategy logo for C#</title>
  <desc id="description">A tiny doji rests alone in a cradle between a bearish gap and a strong bullish candle, followed by an upward turn.</desc>
  <style>
    :root { color-scheme: light dark; }
