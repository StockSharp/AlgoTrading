    <path class="primary-light" d="M62 132 L450 132 L450 190 L62 190 Z" />
    <path class="pale" d="M92 220 L420 220 L420 388 L92 388 Z" />
    <path class="secondary" d="M120 276 L170 276 L170 388 L120 388 Z M188 302 L238 302 L238 388 L188 388 Z M256 326 L306 326 L306 388 L256 388 Z M324 348 L374 348 L374 388 L324 388 Z" />
    <path class="line-accent" d="M108 248 C185 220 254 224 310 252 C354 274 374 310 388 351" />
