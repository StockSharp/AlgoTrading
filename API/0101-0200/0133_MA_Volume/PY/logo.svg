    <path class="neutral" d="M42 430 L470 430 L470 450 L42 450 Z" />
    <path class="secondary" d="M68 352 L118 352 L118 430 L68 430 Z M135 310 L185 310 L185 430 L135 430 Z M202 274 L252 274 L252 430 L202 430 Z M269 224 L319 224 L319 430 L269 430 Z M336 174 L386 174 L386 430 L336 430 Z" />
    <path class="secondary-light" d="M78 362 L108 362 L108 382 L78 382 Z M145 320 L175 320 L175 340 L145 340 Z M212 284 L242 284 L242 304 L212 304 Z M279 234 L309 234 L309 254 L279 254 Z M346 184 L376 184 L376 204 L346 204 Z" />
    <path class="line-primary" d="M51 357 C126 342 183 306 242 256 C302 206 355 160 431 131" />
    <path class="primary" d="M398 105 L476 110 L434 178 L428 143 Z" />
