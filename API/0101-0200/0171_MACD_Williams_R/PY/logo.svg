    <path class="secondary-light" d="M298 92 L447 92 L447 133 L298 133 Z M298 379 L447 379 L447 420 L298 420 Z" />
    <path class="line-secondary" d="M320 340 L353 381 C367 398 390 386 389 365 L385 202 C384 166 422 152 441 183" />
