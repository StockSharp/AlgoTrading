    <path class="neutral" d="M48 93 L420 93 L420 129 L48 129 Z M48 383 L420 383 L420 419 L48 419 Z" />
    <path class="primary-light" d="M72 320 L118 320 L118 383 L72 383 Z M134 281 L180 281 L180 383 L134 383 Z M196 235 L242 235 L242 383 L196 383 Z M258 181 L304 181 L304 383 L258 383 Z" />
    <path class="secondary" d="M318 118 L354 118 L354 383 L318 383 Z" />
    <path class="line-primary" d="M64 352 C147 331 215 272 274 202 C327 140 365 95 430 70" />
    <path class="primary" d="M398 46 L476 52 L433 120 L428 84 Z" />
    <path class="accent" d="M402 84 L430 70 L441 99 L414 113 Z" />
  </g>
</svg>

