<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Santa Claus Rally strategy logo for C#</title>
  <desc id="description">A red holiday sleigh climbs on a golden market trail, turning the year-end rally into an unmistakable seasonal scene.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
