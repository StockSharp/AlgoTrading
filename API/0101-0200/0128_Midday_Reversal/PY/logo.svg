    <path class="line-accent" d="M256 88 L256 116 M188 72 L207 93 M324 72 L305 93" />
    <path class="neutral" fill-rule="evenodd" d="M256 112 A176 176 0 1 0 256 464 A176 176 0 1 0 256 112 Z M256 146 A142 142 0 1 1 256 430 A142 142 0 1 1 256 146 Z" />
    <path class="line-neutral" d="M256 172 L256 286 L326 286" />
    <path class="accent" d="M243 273 A13 13 0 1 0 269 273 A13 13 0 1 0 243 273 Z" />
    <path class="line-primary" d="M104 338 C156 321 204 244 256 228 C310 211 343 271 391 330" />
    <path class="primary" d="M359 319 L413 378 L431 301 L402 325 Z" />
  </g>
