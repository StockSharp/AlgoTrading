<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Monday Weakness strategy logo for Python</title>
  <desc id="description">The first weekday column drops beneath an otherwise level calendar row, making Monday weakness visible at a glance.</desc>
  <style>
    :root { color-scheme: light dark; }
    .language-mark { fill: #17323d; opacity: 0.07; }
    .python-upper { fill: #2874a6; opacity: 0.07; }
    .python-lower { fill: #aa8108; opacity: 0.07; }
    .primary { fill: #7650a4; } .primary-light { fill: #b59bd4; } .primary-shade { fill: #513370; }
    .secondary { fill: #198f7c; } .secondary-light { fill: #70cbb8; } .secondary-shade { fill: #106658; }
    .accent { fill: #dda63e; } .positive { fill: #3f8b62; } .positive-light { fill: #88c6a5; }
    .negative { fill: #c04e5b; } .negative-light { fill: #ed8c96; }
    .violet { fill: #3f70aa; } .violet-light { fill: #8eb4df; }
    .neutral { fill: #303542; } .pale { fill: #d7cedd; } .shadow { fill: #14262c; opacity: 0.22; }
    .line-primary { fill: none; stroke: #7650a4; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-secondary { fill: none; stroke: #198f7c; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-neutral { fill: none; stroke: #303542; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .line-accent { fill: none; stroke: #dda63e; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .thin-primary { fill: none; stroke: #7650a4; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-secondary { fill: none; stroke: #198f7c; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .thin-neutral { fill: none; stroke: #303542; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .language-mark { fill: #edf6f3; opacity: 0.08; }
      .python-upper { fill: #7ec5ed; opacity: 0.08; }
      .python-lower { fill: #f1ca50; opacity: 0.08; }
      .primary { fill: #aa8cdd; } .primary-light { fill: #d1bdeb; } .primary-shade { fill: #7455a7; }
      .secondary { fill: #45c3aa; } .secondary-light { fill: #91e2d1; } .secondary-shade { fill: #278b78; }
      .accent { fill: #f2ca61; } .positive { fill: #71c795; } .positive-light { fill: #afe0c2; }
      .negative { fill: #f27786; } .negative-light { fill: #ffb1bb; }
      .violet { fill: #70a9e2; } .violet-light { fill: #b4d3f1; }
      .neutral { fill: #f0eff5; } .pale { fill: #82778e; } .shadow { fill: #02090b; opacity: 0.34; }
      .line-primary { stroke: #aa8cdd; } .line-secondary { stroke: #45c3aa; }
      .line-neutral { stroke: #f0eff5; } .line-accent { stroke: #f2ca61; }
      .thin-primary { stroke: #aa8cdd; } .thin-secondary { stroke: #45c3aa; } .thin-neutral { stroke: #f0eff5; }
    }
  </style>
  <g aria-hidden="true">
    <path class="python-upper" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" />
    <path class="python-lower" d="M139 53 C139 26 161 4 188 4 H293 C323 4 347 28 347 58 V157 C347 187 323 211 293 211 H212 C183 211 159 235 159 264 V287 H95 C65 287 41 263 41 233 V194 C41 164 65 140 95 140 H139 Z" transform="rotate(180 256 256)" />
  </g>
  <g aria-hidden="true">
    <path class="neutral" d="M50 72 L462 72 L462 424 L50 424 Z" />
    <path class="violet" d="M50 72 L462 72 L462 134 L50 134 Z" />
    <path class="pale" d="M77 164 L139 164 L139 300 L77 300 Z M157 164 L219 164 L219 300 L157 300 Z M237 164 L299 164 L299 300 L237 300 Z M317 164 L379 164 L379 300 L317 300 Z M397 164 L439 164 L439 300 L397 300 Z" />
    <path class="negative" d="M77 164 L139 164 L139 354 L119 354 L119 384 L97 384 L97 354 L77 354 Z" />
    <path class="line-secondary" d="M108 228 L108 365" />
    <path class="secondary" d="M70 348 L108 410 L146 348 L121 362 L121 322 L95 322 L95 362 Z" />
    <path class="thin-primary" d="M166 332 L430 332" />
  </g>
</svg>

